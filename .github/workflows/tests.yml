name: tests

# The plugin itself compiles against Studio's own assemblies, which are not redistributable,
# so CI only runs the unit tests for the pure parts (HID parsing, axis shaping, bindings).
# Release zips are built locally with tools\make-release.ps1.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/StudioSpaceMouse.Tests --nologo
